esphome:
  name: rf-test-tx
  friendly_name: RF Test Transmitter

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf
    version: "6.0.1"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret enc_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_pwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Distinct IP — .201 hymertest, .202 vent-sniffer, .203 this TX node, .204 RX node
  manual_ip:
    static_ip: 10.129.28.203
    gateway: 10.129.28.1
    subnet: 255.255.255.0
    dns1: 10.129.28.1

  ap:
    ssid: "rf-test-tx-fallback"
    password: !secret ap_pwd

captive_portal:

# ---------------------------------------------------------------------------
# TX module wiring (FS1000A / XY-FST or similar 433 MHz OOK):
#
#   VCC  → 5V (USB VIN — REQUIRED for range; 3.3V severely limits range)
#   GND  → GND
#   DATA → GPIO5
#   ANT  → 17.3 cm straight copper wire (quarter-wave @ 433.92 MHz)
#
# If using a 315 MHz module: replace ANT with  cm wire.
# ---------------------------------------------------------------------------
remote_transmitter:
  pin: GPIO5
  carrier_duty_percent: 100%   # pure OOK — no subcarrier

# ---------------------------------------------------------------------------
# Simple LED on GPIO8 — blinks while transmitting.
# ---------------------------------------------------------------------------
output:
  - platform: gpio
    pin: GPIO8
    id: led_output

# ---------------------------------------------------------------------------
# Test packet — EV1527-compatible, RC-Switch protocol 1, 24-bit variable code.
#   Upper 16 bits (address): 0xAAAA  (fixed)
#   Lower  8 bits (command): tx_count & 0xFF  (increments each burst, wraps at 256)
#   Example sequence: 0xAAAA00, 0xAAAA01, 0xAAAA02, …
#
# Transmitted 5× per burst (EV1527 receivers need repeated frames to act).
# ---------------------------------------------------------------------------
globals:
  - id: tx_count
    type: int
    restore_value: false
    initial_value: '0'

# Auto-transmit every 5 seconds so you can verify RX without touching anything.
interval:
  - interval: 5s
    then:
      - globals.set:
          id: tx_count
          value: !lambda 'return id(tx_count) + 1;'
      - logger.log:
          level: INFO
          format: "TX #%d  code=0xAAAA%02X  protocol=1  repeat=5"
          args: ['id(tx_count)', 'id(tx_count) & 0xFF']
      # LED on → transmit → LED off
      - output.turn_on: led_output
      - remote_transmitter.transmit_rc_switch_raw:
          code: !lambda |-
            uint32_t val = (0xAAAAu << 8) | (id(tx_count) & 0xFF);
            std::string s;
            s.reserve(24);
            for (int i = 23; i >= 0; i--)
              s += (val & (1u << i)) ? '1' : '0';
            return s;
          protocol: 1
          repeat:
            times: 5
            wait_time: 10ms
      - logger.log:
          level: INFO
          format: "TX #%d  5x burst complete"
          args: ['id(tx_count)']
      - delay: 200ms
      - output.turn_off: led_output

# Manual on-demand button exposed to Home Assistant.
button:
  - platform: template
    name: "Send Test Packet Now"
    icon: mdi:radio-tower
    on_press:
      - globals.set:
          id: tx_count
          value: !lambda 'return id(tx_count) + 1;'
      - logger.log:
          level: INFO
          format: "Manual TX #%d  code=0xAAAA%02X"
          args: ['id(tx_count)', 'id(tx_count) & 0xFF']
      - output.turn_on: led_output
      - remote_transmitter.transmit_rc_switch_raw:
          code: !lambda |-
            uint32_t val = (0xAAAAu << 8) | (id(tx_count) & 0xFF);
            std::string s;
            s.reserve(24);
            for (int i = 23; i >= 0; i--)
              s += (val & (1u << i)) ? '1' : '0';
            return s;
          protocol: 1
          repeat:
            times: 5
            wait_time: 10ms
      - logger.log:
          level: INFO
          format: "Manual TX — 5x burst complete"
      - delay: 200ms
      - output.turn_off: led_output

# Expose TX burst count as a diagnostic sensor in HA.
sensor:
  - platform: template
    name: "TX Burst Count"
    id: tx_count_sensor
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: 'return id(tx_count);'
    update_interval: 5s
