# ESP32-C3 Super Mini: existing nRF24 vent controller plus camper sensors.
packages:
  vent: !include peripherals/vent_remote.yaml
  bme280: !include peripherals/bme280.yaml
  battery: !include peripherals/battery_ina219.yaml
  starter_battery: !include peripherals/starter_battery_voltage.yaml  # INA226 at 0x41
  range: !include peripherals/range_vl6180x.yaml

esphome:
  name: esphymer2
  friendly_name: EspHymer 2
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            id(report_fault) = [](const char *label, esphome::Component *c) {
              const char *severity = c->is_failed()          ? "FAILED"
                                   : c->status_has_error()   ? "error"
                                   : c->status_has_warning() ? "warning"
                                                             : nullptr;
              auto &slots = id(faults);
              for (size_t i = 0; i < slots.size(); i++) {
                if (slots[i].first == label) {
                  if (severity == nullptr) {
                    slots.erase(slots.begin() + i);
                  } else {
                    slots[i].second = severity;
                  }
                  return;
                }
              }
              if (severity != nullptr) {
                slots.push_back(std::make_pair(std::string(label), std::string(severity)));
              }
            };

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf
    version: "6.0.1"

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret enc_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_pwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.129.28.205
    gateway: 10.129.28.1
    subnet: 255.255.255.0
    dns1: 10.129.28.1
  ap:
    ssid: "Esphymer2 Fallback Hotspot"
    password: !secret ap_pwd

captive_portal:

i2c:
  sda: GPIO0
  scl: GPIO1
  scan: true
  id: bus_a

one_wire:
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
    id: bus_b

sensor:
  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0xa83c01f095b01928
    id: temp_t2
    name: "T2"
    unit_of_measurement: "°C"
    update_interval: 30s

  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0xdb3c01f0952a3328
    id: temp_t3
    name: "T3"
    unit_of_measurement: "°C"
    update_interval: 30s

binary_sensor:
  - platform: gpio
    id: engine_running
    name: "Engine Running (D+)"
    device_class: running
    pin:
      number: GPIO20
      inverted: true
      mode:
        input: true
        pullup: true

globals:
  - id: faults
    type: std::vector<std::pair<std::string, std::string>>
    restore_value: no

  - id: report_fault
    type: std::function<void(const char *, esphome::Component *)>
    restore_value: no

text_sensor:
  - platform: template
    name: "Device Status"
    id: device_status
    entity_category: diagnostic
    icon: "mdi:stethoscope"
    update_interval: 10s
    lambda: |-
      std::string out;
      for (auto &slot : id(faults)) {
        if (!out.empty()) out += ", ";
        out += slot.first;
        out += ": ";
        out += slot.second;
      }
      if (out.empty()) out = "OK";
      if (out.size() > 250) out.resize(250);

      if (id(device_status).has_state() && id(device_status).state == out) return {};
      return out;

interval:
  - interval: 15s
    then:
      - lambda: |-
          if (id(report_fault)) {
            id(report_fault)("I2C", id(bus_a));
            id(report_fault)("T2", id(temp_t2));
            id(report_fault)("T3", id(temp_t3));
            id(report_fault)("BME280", id(bme280_hub));
            id(report_fault)("INA219", id(ina219_hub));
          }
