# Commission the motor, coupling and StallGuard before setting commissioned to true.
# Full instructions and EN wiring options (with or without STOP interlock): docs/hardware/waste-water-valve/README.md
substitutions:
  commissioned: "false"
  direction_inverted: "false"
  travel_steps: "800"       # 200 full steps/rev, 16 microsteps (1/16), ~3.6° per microstep
  release_steps: "80"       # ~10% margin for homing safety; adjust if stall unreliable
  min_home_steps: "16"      # Minimum 1 full step for stall detection
  min_travel_percent: "80"  # Allow 80–120% overshoot detection
  max_travel_percent: "120"
  phase_timeout_ms: "15000" # 15 s total phase timeout for full travel + homing
  stepper_speed: "600"      # steps/s; 600 µsteps/s ≈ 3 RPM full-step equivalent
  stepper_acceleration: "6000" # steps/s²; smooth acceleration ramp
  
  # TMC2209 V2.0 Configuration for Simax 3D NEMA 17 17HS4401
  tmc_address: "0"          # MS1/MS2 both tied to GND → UART addr 0
  stall_threshold: "50"     # TCOOLTHRS; start at 50, tune 20–80 during commissioning
  sense_resistance: "0.11"  # ohms; MKS TMC2209 V2.0 R6/R7 sense resistors ("R110")
  
  # Motor Current (17HS4401: rated 1.7 A peak, ~1.5 Ω per coil)
  # Valve operates infrequently (~once per 2 days max); use higher run current for reliable torque.
  # Idle power saving is handled by disabling EN when motion ends.
  run_current: "1.2"        # A RMS; provides strong torque for reliable operation

esphome:
  name: waste-water-valve
  friendly_name: Waste Water Valve
  includes:
    - waste_valve_logic.h
    - waste_valve_tmc2209.h
    - waste_valve_esphome.h
  on_boot:
    - priority: -100
      then:
        - delay: 500ms
        - lambda: |-
            static waste_valve::ESPHomeHardware hardware(
                id(tmc_uart), id(valve_motor), id(motor_enable), id(enable_feedback),
                id(stall_diag), id(diag_edges), id(valve_position), id(valve_fault), id(valve_ready),
                id(stallguard_value), ${tmc_address}, ${stall_threshold},
                ${sense_resistance}f, ${run_current}f);
            static waste_valve::Controller valve_controller(
                hardware, {${commissioned}, ${travel_steps}, ${release_steps},
                           ${min_home_steps}, ${min_travel_percent}, ${max_travel_percent},
                           ${phase_timeout_ms}});
            waste_valve::controller = &valve_controller;
            valve_controller.begin();

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf
    version: "6.0.1"

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret enc_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_pwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "Waste Valve Fallback"
    password: !secret ap_pwd

captive_portal:

uart:
  id: tmc_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 115200
  rx_buffer_size: 256

stepper:
  - platform: a4988
    id: valve_motor
    step_pin: GPIO0
    dir_pin:
      number: GPIO1
      inverted: ${direction_inverted}
    max_speed: ${stepper_speed} steps/s
    acceleration: ${stepper_acceleration} steps/s^2
    deceleration: ${stepper_acceleration} steps/s^2

switch:
  - platform: gpio
    id: motor_enable
    internal: true
    pin:
      number: GPIO3
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: stall_diag
    internal: true
    use_interrupt: false
    pin:
      number: GPIO6
      allow_other_uses: true
      mode:
        input: true
        pulldown: true
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->tick();

  - platform: gpio
    id: enable_feedback
    internal: true
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->tick();

  - platform: template
    id: valve_ready
    name: "Position Inferred"
    entity_category: diagnostic
    icon: mdi:check-circle-outline

text_sensor:
  - platform: template
    id: valve_position
    name: "Position"
    icon: mdi:valve

  - platform: template
    id: valve_fault
    name: "Fault"
    entity_category: diagnostic
    icon: mdi:alert-circle-outline

sensor:
  - platform: pulse_counter
    id: diag_edges
    internal: true
    use_pcnt: false
    pin:
      number: GPIO6
      allow_other_uses: true
      mode:
        input: true
        pulldown: true
    count_mode:
      rising_edge: INCREMENT
      falling_edge: INCREMENT
    internal_filter: 0us
    update_interval: 10ms
    on_value:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->diag_sample(x > 0);

  - platform: template
    id: stallguard_value
    name: "StallGuard Result"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

button:
  - platform: template
    name: "Open"
    icon: mdi:valve-open
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->open();
          else ESP_LOGW("waste_valve", "Controller not ready");

  - platform: template
    name: "Close"
    icon: mdi:valve-closed
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->close();
          else ESP_LOGW("waste_valve", "Controller not ready");

  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->stop();
          else ESP_LOGW("waste_valve", "Controller not ready");

  - platform: template
    name: "Home Retry"
    icon: mdi:restart-alert
    entity_category: config
    on_press:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->home();
          else ESP_LOGW("waste_valve", "Controller not ready");

interval:
  - interval: 10ms
    then:
      - lambda: |-
          if (waste_valve::controller != nullptr) waste_valve::controller->tick();
