# Conductive 4-step tank probe. Included once per tank with vars (see esphymer.yaml).
#
# Common electrode is connected to GND. Sense pins stay high-impedance except
# for ~25 ms of pull-up per reading, limiting DC current and electrode corrosion.
esphome:
  on_boot:
    - priority: 600
      then:
        # Do not continuously poll floating inputs between samples.
        - lambda: |-
            id(${tank_id}_25_input).disable_loop();
            id(${tank_id}_50_input).disable_loop();
            id(${tank_id}_75_input).disable_loop();
            id(${tank_id}_100_input).disable_loop();

binary_sensor:
  - platform: gpio
    id: ${tank_id}_25_input
    internal: true
    pin:
      id: ${tank_id}_25_pin
      number: ${pin_25}
      mode:
        input: true
    use_interrupt: false

  - platform: gpio
    id: ${tank_id}_50_input
    internal: true
    pin:
      id: ${tank_id}_50_pin
      number: ${pin_50}
      mode:
        input: true
    use_interrupt: false

  - platform: gpio
    id: ${tank_id}_75_input
    internal: true
    pin:
      id: ${tank_id}_75_pin
      number: ${pin_75}
      mode:
        input: true
    use_interrupt: false

  - platform: gpio
    id: ${tank_id}_100_input
    internal: true
    pin:
      id: ${tank_id}_100_pin
      number: ${pin_100}
      mode:
        input: true
    use_interrupt: false

  - platform: template
    id: ${tank_id}_tank_full
    name: "${tank_name} Tank Full"
    device_class: ${full_device_class}

sensor:
  - platform: template
    id: ${tank_id}_level
    name: "${tank_name} Level"
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

script:
  - id: sample_${tank_id}_level
    mode: single
    then:
      - lambda: |-
          id(${tank_id}_25_pin)->pin_mode(gpio::FLAG_INPUT | gpio::FLAG_PULLUP);
          id(${tank_id}_50_pin)->pin_mode(gpio::FLAG_INPUT | gpio::FLAG_PULLUP);
          id(${tank_id}_75_pin)->pin_mode(gpio::FLAG_INPUT | gpio::FLAG_PULLUP);
          id(${tank_id}_100_pin)->pin_mode(gpio::FLAG_INPUT | gpio::FLAG_PULLUP);
      - delay: 25ms
      - lambda: |-
          const bool wet_25 = !id(${tank_id}_25_pin)->digital_read();
          const bool wet_50 = !id(${tank_id}_50_pin)->digital_read();
          const bool wet_75 = !id(${tank_id}_75_pin)->digital_read();
          const bool wet_100 = !id(${tank_id}_100_pin)->digital_read();

          id(${tank_id}_25_pin)->pin_mode(gpio::FLAG_INPUT);
          id(${tank_id}_50_pin)->pin_mode(gpio::FLAG_INPUT);
          id(${tank_id}_75_pin)->pin_mode(gpio::FLAG_INPUT);
          id(${tank_id}_100_pin)->pin_mode(gpio::FLAG_INPUT);

          float level = 0.0f;
          if (wet_25) level = 25.0f;
          if (wet_50) level = 50.0f;
          if (wet_75) level = 75.0f;
          if (wet_100) level = 100.0f;

          if (!id(${tank_id}_level).has_state() || id(${tank_id}_level).state != level) {
            id(${tank_id}_level).publish_state(level);
          }

          const bool tank_full = wet_100;
          if (!id(${tank_id}_tank_full).has_state() || id(${tank_id}_tank_full).state != tank_full) {
            id(${tank_id}_tank_full).publish_state(tank_full);
          }

interval:
  - interval: 1s
    then:
      - script.execute: sample_${tank_id}_level
