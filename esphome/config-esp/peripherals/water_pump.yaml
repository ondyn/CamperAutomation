# Water pump enable, active-low via N-MOS/optocoupler (same drive style as the EBL30
# lines): the ESP GPIO must go LOW to switch the pump on, so `inverted: true` makes
# ESPHome's own on/off logic match Home Assistant's. Defaults OFF on boot/reset -
# verify polarity in hardware before trusting a fresh install.
switch:
  - platform: gpio
    id: water_pump
    name: "Water Pump"
    pin: GPIO47
    inverted: true
    restore_mode: ALWAYS_OFF
