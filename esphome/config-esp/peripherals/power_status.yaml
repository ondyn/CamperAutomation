# 12V supply and mains (230V) presence indicators for the ESP32-S3 node.
# Inputs use pull-ups and inverted logic: an optocoupler pulling the GPIO LOW means present.
binary_sensor:
  - platform: gpio
    id: supply_12v_present
    name: "12V Supply Present"
    device_class: power
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true

  - platform: gpio
    id: mains_230v_present
    name: "Mains 230V Connected"
    device_class: plug
    pin:
      number: GPIO6
      inverted: true
      mode:
        input: true
        pullup: true
