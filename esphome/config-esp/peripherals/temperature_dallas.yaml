# The single T1 DS18B20 on the ESP32-S3 esphymer node.
# T2 and T3 are on the separate ESP32-C3 Super Mini in esphymer2.yaml.
one_wire:
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true  # ~45 kΩ internal pull-up; works for short 1-wire runs without external resistor
    id: bus_b

sensor:
  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0x8b3c01f095401e28
    id: temp_t1
    name: "T1"
    unit_of_measurement: "°C"

interval:
  - interval: 15s
    then:
      - lambda: |-
          if (id(report_fault)) {
            id(report_fault)("T1", id(temp_t1));
          }
