# DS18B20 1-Wire temperature sensors (×3).
one_wire:
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true  # ~45 kΩ internal pull-up; works for short 1-wire runs without external resistor
    id: bus_b

sensor:
  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0x8b3c01f095401e28
    id: temp_t1
    name: "T1"
    unit_of_measurement: "°C"

  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0xa83c01f095b01928
    id: temp_t2
    name: "T2"
    unit_of_measurement: "°C"

  - platform: dallas_temp
    one_wire_id: bus_b
    address: 0xdb3c01f0952a3328
    id: temp_t3
    name: "T3"
    unit_of_measurement: "°C"

interval:
  - interval: 15s
    then:
      - lambda: |-
          if (id(report_fault)) {
            id(report_fault)("T1", id(temp_t1));
            id(report_fault)("T2", id(temp_t2));
            id(report_fault)("T3", id(temp_t3));
          }
