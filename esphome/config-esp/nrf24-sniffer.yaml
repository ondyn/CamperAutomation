# ===========================================================================
# nRF24L01 2.4 GHz band scanner
#
# Purpose: prove, or rule out, that the roof-vent remote transmits somewhere in
# the 2.4 GHz ISM band.  Standalone diagnostic node - deliberately no Wi-Fi, no
# API, no OTA, so the ESP's own radio cannot pollute the measurement.  Read the
# results over USB serial:
#     docker exec -it esphome-esphome-1 esphome logs /config/nrf24-sniffer.yaml
# or flash and watch the serial port directly (see docs in esphome-hardware notes).
#
# ---------------------------------------------------------------------------
# RF test status for this vent (updated 2026-09-21)
# (background: docs/architecture/vent-rf-integration.md)
# ---------------------------------------------------------------------------
#   * 433.92 MHz OOK was the first hypothesis, based on the vent's pairing
#     procedure. Pairing behaviour alone does not prove EV1527 or the frequency.
#   * config-esp/vent-sniffer.yaml: ESP32-C3 + MX-RM-5V superregenerative
#     receiver on GPIO4 behind a 10k/20k divider, remote_receiver with
#     dump: rc_switch, tolerance 50%, idle 4 ms.  Pronto kept matching plain
#     band noise; rc_switch never produced a repeatable code for any button.
#   * config-esp/rf-test-tx.yaml + rf-test-rx.yaml: a deliberate loopback pair.
#     The TX node sends a known 24-bit EV1527 frame (0xAAAAnn) every 5 s so the
#     RX node can be validated independently.  This separates "our 433 MHz rig
#     is broken" from "the remote is not 433 MHz OOK".
#   * 315 MHz was also tested without repeatable remote-correlated activity.
#   * 868 MHz (CC1101 RSSI sweep, vent-868-sniffer.yaml) negative 2026-10-04.
#   * 2026-10-04 re-assessment: the remote PCB (vent/ photos) carries a ~2 cm
#     inverted-F PCB antenna (2.4 GHz size), an unmarked SSOP16 transceiver and
#     a 12.000 MHz crystal -> LT8900/LT8910/LT8920/PL1167 family, 2.4 GHz GFSK.
#     The first version of this scanner read RPD once per 200 us hop (one
#     ~40 us snapshot), so a short-packet remote was nearly invisible next to
#     Wi-Fi, and its sniffer ran at 2 Mbps on the busiest (Wi-Fi) channel.
#     The 2.4 GHz "negative" was therefore inconclusive.  Rewritten 2026-10-04.
#
# ---------------------------------------------------------------------------
# Wiring: nRF24L01(+) module -> ESP32-C3 mini
# ---------------------------------------------------------------------------
# The module carries a 2x4 pin header.  Hold it component-side up with the
# antenna (PCB trace or SMA connector) pointing away from you; the header is
# then nearest to you and pin 1 is the bottom-left pin:
#
#        +------+------+
#   GND  |  1   |  2   |  VCC
#   CE   |  3   |  4   |  CSN
#   SCK  |  5   |  6   |  MOSI
#   MISO |  7   |  8   |  IRQ
#        +------+------+
#
#   nRF24 pin        ESP32-C3 mini pin   note
#   --------------   -----------------   ------------------------------------
#   1  GND       ->  GND
#   2  VCC       ->  3V3                 3.3 V ONLY.  5 V destroys the chip.
#   3  CE        ->  GPIO3
#   4  CSN       ->  GPIO7
#   5  SCK       ->  GPIO4
#   6  MOSI      ->  GPIO6
#   7  MISO      ->  GPIO5
#   8  IRQ       ->  leave unconnected
#
# MANDATORY: solder a 10 uF (4.7-100 uF is fine) electrolytic or tantalum cap
# directly across pins 1 and 2 at the module header, ideally with a 100 nF in
# parallel.  The nRF24 draws short current spikes the C3's 3V3 regulator cannot
# follow over breadboard wires; without the cap the module either never answers
# on SPI or reports random data.  This is by far the most common failure.
#
# Keep the SPI wires short (< 15 cm).  PA+LNA variants draw far more current -
# feed those from a separate 3.3 V LDO, not from the C3's 3V3 pin.
#
# Signal logic is 5 V tolerant on the inputs, so no dividers are needed here.
#
# ---------------------------------------------------------------------------
# How to run it  (sniff_ch below picks the mode)
# ---------------------------------------------------------------------------
# If the LED blinks fast / the log says "nRF24 not responding", fix the
# wiring/cap first.
#
# BUTTON mode (sniff_ch >= 0, default 29 = 2429 MHz): decode the remote.
#   The log names the remote button to press.  Press it 4-10x, ~2 s apart,
#   remote 10-30 cm from the nRF24 antenna, and note what the remote display /
#   vent does each time.  Each press prints the majority-voted packet (bytes
#   shown LSB-first, as the remote sends them), the decoded fan level, and the
#   bytes that changed vs the previous press:
#     [POWER ] #2  8B 02 C1 8C 4A F8 C2 10 00 70 00 7C 06 ... | fan 0% | q 94% 9/9
#               vs #1:  b11 79>7C  b14 67>DA  b15 15>0C
#   BOOT tap  = sequence report for this button + table of all buttons, then
#               the next button.  Each changing byte is classified:
#               A = alternates (explicit ON/OFF-style state),
#               +/- = steps every press (absolute level, or a press counter),
#               ~ = no simple pattern (checksum, rolling code or noise).
#   BOOT hold = clear this button and start again (e.g. "+" from 0 %).
#   Presses with q < 80 % are shown but ignored by the analysis.
#   Few decoded presses / low q: try sniff_ch 28 or 30 (frequency offset).
#
# SCAN mode (sniff_ch "-1"): find the channel.  Press BOOT once, then follow
#   the LED: 20 s HANDS OFF (blip every second) / 20 s PRESS (solid on).  A
#   VERDICT line names the channel used only while pressing.  Wi-Fi shows up
#   as ~22-channel-wide blobs, BLE adverts on nRF ch 2, 26 and 80.
# LT89xx channel = nRF channel - 2.
# ===========================================================================

substitutions:
  devicename: nrf24-sniffer
  friendly_name: nRF24 Sniffer

  pin_ce: "3"
  pin_csn: "7"
  pin_sck: "4"
  pin_miso: "5"
  pin_mosi: "6"
  pin_led: "8"
  pin_boot: "9"
  # nRF channel to sniff right away (2400 + n MHz); "-1" = scan for it first.
  # 2026-10-05 scan: remote-correlated on 29 (2429 MHz), weaker on 9 and 41.
  sniff_ch: "29"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: Offline nRF24L01 2.4 GHz scanner for vent remote detection
  includes:
    - nrf24_scanner.h
  on_boot:
    priority: -100
    then:
      - lambda: 'nrf24::begin(${pin_sck}, ${pin_miso}, ${pin_mosi}, ${pin_csn}, ${pin_ce}, ${pin_led}, ${pin_boot}, ${sniff_ch});'

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf
    version: "6.0.1"

logger:
  level: INFO

interval:
  - interval: 50ms
    then:
      - lambda: 'nrf24::tick();'
