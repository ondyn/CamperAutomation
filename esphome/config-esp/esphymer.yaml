# Target board: ESP32-S3-DevKitC-1 N16R8 (16 MB quad flash, 8 MB octal PSRAM, IPEX antenna)
# Pin map rationale: see docs/hardware/esp32s3-wiring-guide.md
#
# ==============================================================================
#  PERIPHERAL SUBSYSTEMS — comment a line out to build the node without it.
# ==============================================================================
# ESPHome has no in-file conditionals, so each subsystem lives in its own file
# under peripherals/ and is switched here. Everything below this block is the
# core the node cannot run without: board, radio, API, status LED, diagnostics.
packages:
  temperature:   !include peripherals/temperature_dallas.yaml
  # bme280:        !include peripherals/bme280.yaml
  truma:         !include peripherals/truma.yaml
  pir:           !include peripherals/pir.yaml
  phone_charger: !include peripherals/phone_charger.yaml
  # battery:       !include peripherals/battery_ina219.yaml
  rain:          !include peripherals/rain.yaml
  # VL6180X pulls a third-party component from GitHub at build time — off until wired.
  # range:       !include peripherals/range_vl6180x.yaml

  fresh_water: !include
    file: peripherals/water_tank.yaml
    vars:
      tank_id: fresh_water
      tank_name: Fresh Water
      full_device_class: moisture
      pin_common: GPIO11
      pin_25: GPIO12
      pin_50: GPIO13
      pin_75: GPIO14
      pin_100: GPIO15

  waste_water: !include
    file: peripherals/water_tank.yaml
    vars:
      tank_id: waste_water
      tank_name: Waste Water
      full_device_class: problem
      pin_common: GPIO21
      pin_25: GPIO39
      pin_50: GPIO40
      pin_75: GPIO41
      pin_100: GPIO42

substitutions:
  # DevKitC-1 v1.1 wires the onboard WS2812 to GPIO38, v1.0 to GPIO48.
  status_led_pin: GPIO48

esphome:
  name: esphymer
  friendly_name: EspHymer
  on_boot:
    - priority: 800
      then:
        # Shared fault collector: each peripheral package reports its own components
        # into a slot, and "Device Status" publishes the merged list.
        - lambda: |-
            id(report_fault) = [](const char *label, esphome::Component *c) {
              const char *severity = c->is_failed()          ? "FAILED"
                                   : c->status_has_error()   ? "error"
                                   : c->status_has_warning() ? "warning"
                                                             : nullptr;
              auto &slots = id(faults);
              for (size_t i = 0; i < slots.size(); i++) {
                if (slots[i].first == label) {
                  if (severity == nullptr) {
                    slots.erase(slots.begin() + i);
                  } else {
                    slots[i].second = severity;
                  }
                  return;
                }
              }
              if (severity != nullptr) {
                slots.push_back(std::make_pair(std::string(label), std::string(severity)));
              }
            };

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: "6.0.1"  # 6.0.x restructured esp_timer/esp_system sources; no more system_time.c collision
    sdkconfig_options:
      CONFIG_BT_ENABLED: "n"  # no BLE peripheral on this node; keeps the controller stack out of the image

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # Board is flashed/monitored through the CH343 "UART" port (GPIO43/44), not the
  # native-USB port, so override the ESP32-S3 default of USB_SERIAL_JTAG.
  hardware_uart: UART0

# Enable Home Assistant API
api:
  id: api_server
  encryption:
    key: "DxJyuDSu+sOFMlQPB3AWx5LpFdiWzI3yYjBDqvoFG9M="
  reboot_timeout: 0s

# Enable mDNS service advertisement for discovery
mdns:
  disabled: false

ota:
  - platform: esphome
    password: !secret ota_pwd

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # The phone hotspot sits <1 m away, so run the radio at the lowest sane TX power
  # and let the modem sleep between beacons.
  output_power: 11dB
  power_save_mode: light

  # Static IP to avoid DHCP reassignment on Android hotspot reboot
  manual_ip:
    static_ip: 10.129.28.200
    gateway: 10.129.28.1
    subnet: 255.255.255.0
    dns1: 10.129.28.1

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphymer Fallback Hotspot"
    password: !secret ap_pwd

captive_portal:

globals:
  # Drives the status-LED pattern generator; wraps every 4 s at a 100 ms tick.
  - id: led_tick
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: faults
    type: std::vector<std::pair<std::string, std::string>>
    restore_value: no

  - id: report_fault
    type: std::function<void(const char *, esphome::Component *)>
    restore_value: no

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  id: bus_a

# Onboard WS2812 status LED. Kept internal: the pattern generator below owns it, and
# Home Assistant steers it through the notification select + brightness number instead.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: ${status_led_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    name: "Status LED Brightness"
    id: status_led_brightness
    entity_category: config
    icon: "mdi:brightness-6"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    mode: slider

select:
  # Home Assistant raises notifications here (charger offline, battery low, ...).
  # Anything other than "None" overrides the device's own OK/idle pattern.
  - platform: template
    name: "Status LED Notification"
    id: status_led_notification
    entity_category: config
    icon: "mdi:bell-alert"
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Info"
      - "Warning"
      - "Alert"
      - "Critical"

binary_sensor:
  # Mirrors the status LED for anything that can only be seen on the serial console
  # otherwise; this node runs headless in the van.
  - platform: template
    name: "Device Problem"
    id: device_problem
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return (App.get_app_state() & (STATUS_LED_ERROR | STATUS_LED_WARNING)) != 0;

text_sensor:
  - platform: template
    name: "Device Status"
    id: device_status
    entity_category: diagnostic
    icon: "mdi:stethoscope"
    update_interval: 10s
    lambda: |-
      std::string out;
      for (auto &slot : id(faults)) {
        if (!out.empty()) out += ", ";
        out += slot.first;
        out += ": ";
        out += slot.second;
      }
      if (out.empty()) out = "OK";
      if (out.size() > 250) out.resize(250);

      if (id(device_status).has_state() && id(device_status).state == out) return {};
      return out;

interval:
  - interval: 15s
    then:
      - lambda: 'if (id(report_fault)) id(report_fault)("I2C", id(bus_a));'

  # Status LED pattern generator.
  #
  #   Source   State                     Colour    Pattern
  #   ------   -----------------------   -------   ----------------------------------
  #   ESP      connecting to Wi-Fi       violet    fast blink   (200 ms on / 200 ms off)
  #   ESP      Wi-Fi up, no HA API       blue      fast blink   (200 ms on / 200 ms off)
  #   ESP      component error           red       fast blink   (200 ms on / 200 ms off)
  #   ESP      component warning         amber     fast blink   (200 ms on / 200 ms off)
  #   HA       notification: Info        cyan      slow blink   (1 s on / 1 s off)
  #   HA       notification: Warning     amber     slow blink
  #   HA       notification: Alert       orange    slow blink
  #   HA       notification: Critical    magenta   slow blink
  #   ESP      everything OK             green     slow breathe (~4 s period)
  #
  # Fast blink always means "the node is telling you something", slow blink always
  # means "Home Assistant is telling you something".
  - interval: 100ms
    then:
      - lambda: |-
          const uint32_t tick = id(led_tick)++;
          const float dim = id(status_led_brightness).state / 100.0f;

          if (dim <= 0.0f) {
            if (id(status_led).current_values.is_on()) {
              auto off = id(status_led).turn_off();
              off.set_transition_length(0);
              off.perform();
            }
            return;
          }

          float r = 0.0f, g = 0.0f, b = 0.0f;
          bool on = true;

          // 200 ms on / 200 ms off, and 1 s on / 1 s off at a 100 ms tick.
          const bool fast_phase = (tick % 4) < 2;
          const bool slow_phase = (tick % 20) < 10;

          const std::string note = id(status_led_notification).current_option().str();

          if (!id(wifi_comp).is_connected()) {
            r = 1.0f; g = 0.0f; b = 1.0f; on = fast_phase;            // violet
          } else if (!id(api_server).is_connected()) {
            r = 0.0f; g = 0.2f; b = 1.0f; on = fast_phase;            // blue
          } else if (App.get_app_state() & STATUS_LED_ERROR) {
            r = 1.0f; g = 0.0f; b = 0.0f; on = fast_phase;            // red
          } else if (note == "Critical") {
            r = 1.0f; g = 0.0f; b = 0.6f; on = slow_phase;            // magenta
          } else if (note == "Alert") {
            r = 1.0f; g = 0.25f; b = 0.0f; on = slow_phase;           // orange
          } else if (note == "Warning") {
            r = 1.0f; g = 0.6f; b = 0.0f; on = slow_phase;            // amber
          } else if (note == "Info") {
            r = 0.0f; g = 0.8f; b = 1.0f; on = slow_phase;            // cyan
          } else if (App.get_app_state() & STATUS_LED_WARNING) {
            r = 1.0f; g = 0.6f; b = 0.0f; on = fast_phase;            // amber
          } else {
            // Healthy: slow green breathe so the LED is never a hard blink at night.
            const float phase = (tick % 40) / 40.0f;
            const float breathe = 0.15f + 0.85f * (0.5f - 0.5f * cosf(2.0f * M_PI * phase));
            r = 0.0f; g = breathe; b = 0.0f;
          }

          if (!on) {
            r = g = b = 0.0f;
          }

          const float level = std::max({r, g, b});
          auto call = id(status_led).turn_on();
          call.set_transition_length(0);
          if (level <= 0.0f) {
            call.set_brightness(0.0f);
          } else {
            call.set_brightness(level * dim);
            call.set_rgb(r / level, g / level, b / level);
          }
          call.perform();
