<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #f8fafb; }
      .panel { fill: #ffffff; stroke: #a8b3bd; stroke-width: 2; }
      .esp { fill: #e9f5ee; stroke: #357a50; stroke-width: 3; }
      .ebl { fill: #fff4e5; stroke: #a86116; stroke-width: 3; }
      .wire { fill: none; stroke: #263238; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .power { fill: none; stroke: #b3261e; stroke-width: 4; stroke-linecap: round; }
      .ground { fill: none; stroke: #1769aa; stroke-width: 4; stroke-linecap: round; }
      .isolation { fill: none; stroke: #7b61a8; stroke-width: 3; stroke-dasharray: 12 10; }
      .component { fill: #ffffff; stroke: #263238; stroke-width: 3; }
      .mosfet { fill: none; stroke: #263238; stroke-width: 4; stroke-linecap: round; }
      .node { fill: #263238; }
      .title { font: 700 34px 'Helvetica Neue', Helvetica, sans-serif; fill: #17212b; }
      .subtitle { font: 20px 'Helvetica Neue', Helvetica, sans-serif; fill: #44515c; }
      .label { font: 600 20px 'Helvetica Neue', Helvetica, sans-serif; fill: #17212b; }
      .small { font: 17px 'Helvetica Neue', Helvetica, sans-serif; fill: #37444f; }
      .tiny { font: 15px 'Helvetica Neue', Helvetica, sans-serif; fill: #53616c; }
      .net { font: 700 18px 'Helvetica Neue', Helvetica, sans-serif; fill: #17212b; }
      .warning { fill: #fff0f0; stroke: #b3261e; stroke-width: 2; }
      .note { fill: #eef5fb; stroke: #1769aa; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <text x="70" y="62" class="title">ESP32 → Schaudt EBL 30 isolated A11/A12 pulse driver</text>
  <text x="70" y="98" class="subtitle">Two identical channels; AOD484 N-MOSFETs emulate the LT panel's momentary pull-to-A7 contacts</text>

  <rect x="55" y="130" width="430" height="705" rx="8" class="esp"/>
  <text x="82" y="170" class="label">ESP32-S3 domain (3.3 V)</text>
  <text x="82" y="199" class="small">Powered independently; no connection to A7</text>

  <rect x="515" y="130" width="1030" height="705" rx="8" class="ebl"/>
  <text x="545" y="170" class="label">EBL 30 / BW99 domain (nominal 12 V)</text>
  <text x="545" y="199" class="small">A4 supplies only the isolated gate circuits; A7 is the EBL reference</text>

  <line x1="500" y1="130" x2="500" y2="835" class="isolation"/>
  <text x="500" y="858" class="tiny" text-anchor="middle">ISOLATION</text>

  <!-- ESP-side channel 1 -->
  <text x="82" y="260" class="label">SYSTEM ON</text>
  <rect x="84" y="287" width="125" height="58" rx="5" class="component"/>
  <text x="146" y="323" class="net" text-anchor="middle">GPIO47</text>
  <line x1="209" y1="316" x2="250" y2="316" class="wire"/>
  <rect x="250" y="294" width="105" height="44" class="component"/>
  <text x="302" y="322" class="small" text-anchor="middle">680 Ω</text>
  <line x1="355" y1="316" x2="390" y2="316" class="wire"/>
  <path d="M390 296 L390 336 L426 316 Z" fill="none" stroke="#263238" stroke-width="3"/>
  <line x1="432" y1="294" x2="432" y2="338" class="wire"/>
  <line x1="432" y1="316" x2="465" y2="316" class="wire"/>
  <text x="411" y="281" class="tiny" text-anchor="middle">PC817-ON LED</text>
  <line x1="465" y1="316" x2="465" y2="375" class="ground"/>
  <path d="M442 375 H488 M449 386 H481 M457 397 H473" class="ground"/>
  <text x="390" y="393" class="small" text-anchor="end">GND_ESP</text>

  <!-- ESP-side channel 2 -->
  <text x="82" y="540" class="label">SYSTEM OFF</text>
  <rect x="84" y="567" width="125" height="58" rx="5" class="component"/>
  <text x="146" y="603" class="net" text-anchor="middle">GPIO38</text>
  <line x1="209" y1="596" x2="250" y2="596" class="wire"/>
  <rect x="250" y="574" width="105" height="44" class="component"/>
  <text x="302" y="602" class="small" text-anchor="middle">680 Ω</text>
  <line x1="355" y1="596" x2="390" y2="596" class="wire"/>
  <path d="M390 576 L390 616 L426 596 Z" fill="none" stroke="#263238" stroke-width="3"/>
  <line x1="432" y1="574" x2="432" y2="618" class="wire"/>
  <line x1="432" y1="596" x2="465" y2="596" class="wire"/>
  <text x="411" y="561" class="tiny" text-anchor="middle">PC817-OFF LED</text>
  <line x1="465" y1="596" x2="465" y2="655" class="ground"/>
  <path d="M442 655 H488 M449 666 H481 M457 677 H473" class="ground"/>
  <text x="390" y="673" class="small" text-anchor="end">GND_ESP</text>

  <text x="1500" y="244" class="small" text-anchor="end">A4 supplies both isolated-side gate drivers</text>

  <!-- Optocoupler output channel 1 -->
  <rect x="570" y="286" width="170" height="132" rx="6" class="component"/>
  <text x="655" y="311" class="small" text-anchor="middle">PC817-ON</text>
  <text x="655" y="401" class="tiny" text-anchor="middle">output transistor</text>
  <line x1="617" y1="334" x2="617" y2="380" class="wire"/>
  <line x1="617" y1="334" x2="650" y2="350" class="wire"/>
  <line x1="617" y1="380" x2="650" y2="364" class="wire"/>
  <line x1="650" y1="340" x2="650" y2="374" class="wire"/>
  <line x1="669" y1="340" x2="669" y2="374" class="wire"/>
  <line x1="669" y1="350" x2="702" y2="334" class="wire"/>
  <line x1="669" y1="364" x2="702" y2="380" class="wire"/>
  <line x1="702" y1="334" x2="702" y2="286" class="wire"/>
  <line x1="702" y1="380" x2="702" y2="418" class="wire"/>
  <line x1="702" y1="286" x2="702" y2="252" class="power"/>
  <path d="M690 252 L702 232 L714 252 Z" fill="#b3261e"/>
  <text x="722" y="248" class="net">A4 +12 V</text>
  <text x="716" y="280" class="tiny">C</text>
  <text x="716" y="414" class="tiny">E</text>

  <line x1="702" y1="418" x2="775" y2="418" class="wire"/>
  <rect x="775" y="396" width="100" height="44" class="component"/>
  <text x="825" y="424" class="small" text-anchor="middle">1 kΩ</text>
  <line x1="875" y1="418" x2="940" y2="418" class="wire"/>
  <circle cx="940" cy="418" r="6" class="node"/>
  <text x="895" y="398" class="tiny">gate node</text>

  <!-- MOSFET channel 1 -->
  <line x1="940" y1="418" x2="1000" y2="418" class="mosfet"/>
  <line x1="1010" y1="388" x2="1010" y2="448" class="mosfet"/>
  <line x1="1030" y1="378" x2="1030" y2="405" class="mosfet"/>
  <line x1="1030" y1="431" x2="1030" y2="458" class="mosfet"/>
  <line x1="1030" y1="378" x2="1100" y2="378" class="mosfet"/>
  <line x1="1030" y1="458" x2="1100" y2="458" class="mosfet"/>
  <text x="1055" y="343" class="label" text-anchor="middle">Q1 AOD484</text>
  <text x="1055" y="365" class="tiny" text-anchor="middle">N-channel, TO-252</text>
  <text x="1110" y="354" class="tiny">D (pin 2 + tab)</text>
  <text x="1110" y="464" class="tiny">S (pin 3)</text>
  <text x="966" y="407" class="tiny">G (pin 1)</text>

  <!-- Rgs and zener channel 1 -->
  <line x1="940" y1="418" x2="940" y2="470" class="wire"/>
  <rect x="918" y="470" width="44" height="80" class="component"/>
  <text x="907" y="500" class="tiny" text-anchor="end">100 kΩ</text>
  <text x="907" y="520" class="tiny" text-anchor="end">RGS1</text>
  <line x1="940" y1="550" x2="1100" y2="550" class="ground"/>
  <line x1="970" y1="470" x2="970" y2="487" class="wire"/>
  <path d="M952 487 H988 L970 514 Z" fill="none" stroke="#263238" stroke-width="3"/>
  <path d="M952 520 L960 516 L980 524 L988 520" class="wire"/>
  <line x1="970" y1="520" x2="970" y2="550" class="wire"/>
  <line x1="970" y1="470" x2="940" y2="470" class="wire"/>
  <line x1="970" y1="550" x2="940" y2="550" class="wire"/>
  <text x="995" y="503" class="tiny">12 V</text>
  <text x="995" y="522" class="tiny">BZX84C12</text>

  <!-- Drain path and A11 -->
  <line x1="1100" y1="378" x2="1190" y2="378" class="wire"/>
  <rect x="1190" y="356" width="105" height="44" class="component"/>
  <text x="1242" y="375" class="small" text-anchor="middle">220 Ω</text>
  <text x="1242" y="393" class="tiny" text-anchor="middle">0.5 W</text>
  <line x1="1295" y1="378" x2="1365" y2="378" class="wire"/>
  <rect x="1365" y="354" width="115" height="48" rx="5" class="component"/>
  <text x="1422" y="385" class="net" text-anchor="middle">A11 ON</text>

  <!-- Optocoupler output channel 2 -->
  <rect x="570" y="566" width="170" height="132" rx="6" class="component"/>
  <text x="655" y="591" class="small" text-anchor="middle">PC817-OFF</text>
  <text x="655" y="681" class="tiny" text-anchor="middle">output transistor</text>
  <line x1="617" y1="614" x2="617" y2="660" class="wire"/>
  <line x1="617" y1="614" x2="650" y2="630" class="wire"/>
  <line x1="617" y1="660" x2="650" y2="644" class="wire"/>
  <line x1="650" y1="620" x2="650" y2="654" class="wire"/>
  <line x1="669" y1="620" x2="669" y2="654" class="wire"/>
  <line x1="669" y1="630" x2="702" y2="614" class="wire"/>
  <line x1="669" y1="644" x2="702" y2="660" class="wire"/>
  <line x1="702" y1="614" x2="702" y2="566" class="wire"/>
  <line x1="702" y1="660" x2="702" y2="698" class="wire"/>
  <line x1="702" y1="566" x2="702" y2="532" class="power"/>
  <path d="M690 532 L702 512 L714 532 Z" fill="#b3261e"/>
  <text x="722" y="528" class="net">A4 +12 V</text>
  <text x="716" y="560" class="tiny">C</text>
  <text x="716" y="694" class="tiny">E</text>

  <line x1="702" y1="698" x2="775" y2="698" class="wire"/>
  <rect x="775" y="676" width="100" height="44" class="component"/>
  <text x="825" y="704" class="small" text-anchor="middle">1 kΩ</text>
  <line x1="875" y1="698" x2="940" y2="698" class="wire"/>
  <circle cx="940" cy="698" r="6" class="node"/>

  <!-- MOSFET channel 2 -->
  <line x1="940" y1="698" x2="1000" y2="698" class="mosfet"/>
  <line x1="1010" y1="668" x2="1010" y2="728" class="mosfet"/>
  <line x1="1030" y1="658" x2="1030" y2="685" class="mosfet"/>
  <line x1="1030" y1="711" x2="1030" y2="738" class="mosfet"/>
  <line x1="1030" y1="658" x2="1100" y2="658" class="mosfet"/>
  <line x1="1030" y1="738" x2="1100" y2="738" class="mosfet"/>
  <text x="1055" y="623" class="label" text-anchor="middle">Q2 AOD484</text>
  <text x="1055" y="645" class="tiny" text-anchor="middle">N-channel, TO-252</text>
  <text x="1110" y="634" class="tiny">D (pin 2 + tab)</text>
  <text x="1110" y="744" class="tiny">S (pin 3)</text>
  <text x="966" y="687" class="tiny">G (pin 1)</text>

  <!-- Rgs and zener channel 2 -->
  <line x1="940" y1="698" x2="940" y2="750" class="wire"/>
  <rect x="918" y="750" width="44" height="80" class="component"/>
  <text x="907" y="780" class="tiny" text-anchor="end">100 kΩ</text>
  <text x="907" y="800" class="tiny" text-anchor="end">RGS2</text>
  <line x1="940" y1="830" x2="940" y2="775" class="ground"/>
  <line x1="970" y1="750" x2="970" y2="767" class="wire"/>
  <path d="M952 767 H988 L970 794 Z" fill="none" stroke="#263238" stroke-width="3"/>
  <path d="M952 800 L960 796 L980 804 L988 800" class="wire"/>
  <line x1="970" y1="800" x2="970" y2="830" class="wire"/>
  <line x1="970" y1="750" x2="940" y2="750" class="wire"/>
  <line x1="970" y1="830" x2="940" y2="830" class="wire"/>
  <text x="995" y="783" class="tiny">12 V</text>
  <text x="995" y="802" class="tiny">BZX84C12</text>

  <!-- Drain path and A12 -->
  <line x1="1100" y1="658" x2="1190" y2="658" class="wire"/>
  <rect x="1190" y="636" width="105" height="44" class="component"/>
  <text x="1242" y="655" class="small" text-anchor="middle">220 Ω</text>
  <text x="1242" y="673" class="tiny" text-anchor="middle">0.5 W</text>
  <line x1="1295" y1="658" x2="1365" y2="658" class="wire"/>
  <rect x="1365" y="634" width="115" height="48" rx="5" class="component"/>
  <text x="1422" y="665" class="net" text-anchor="middle">A12 OFF</text>

  <!-- Shared A7 rail -->
  <line x1="570" y1="775" x2="1420" y2="775" class="ground"/>
  <line x1="1100" y1="458" x2="1100" y2="550" class="ground"/>
  <circle cx="1100" cy="550" r="6" class="node"/>
  <line x1="1100" y1="550" x2="1100" y2="570" class="ground"/>
  <path d="M1077 570 H1123 M1084 581 H1116 M1092 592 H1108" class="ground"/>
  <text x="1128" y="580" class="net">A7</text>
  <line x1="1100" y1="738" x2="1100" y2="775" class="ground"/>
  <circle cx="940" cy="775" r="6" class="node"/>
  <circle cx="1100" cy="775" r="6" class="node"/>
  <rect x="1365" y="751" width="115" height="48" rx="5" class="component"/>
  <text x="1422" y="782" class="net" text-anchor="middle">A7 GND</text>

  <!-- Notes -->
  <rect x="55" y="865" width="725" height="145" rx="8" class="note"/>
  <text x="80" y="899" class="label">Control</text>
  <text x="80" y="930" class="small">• GPIO HIGH for 250–500 ms; LOW at boot and at rest.</text>
  <text x="80" y="960" class="small">• Interlock commands: never pulse ON and OFF together; wait ≥1 s.</text>
  <text x="80" y="990" class="small">• A11/A12 normally remain near 12 V and are only pulled to A7 briefly.</text>

  <rect x="810" y="865" width="735" height="145" rx="8" class="warning"/>
  <text x="835" y="899" class="label">Construction and verification</text>
  <text x="835" y="930" class="small">• AOD484 tab is drain: insulate both tabs from chassis and each other.</text>
  <text x="835" y="960" class="small">• Confirm A4/A7/A11/A12 at the connector before attachment.</text>
  <text x="835" y="990" class="small">• Bench-test each channel first; no ESP GND ↔ A7 connection.</text>
</svg>
